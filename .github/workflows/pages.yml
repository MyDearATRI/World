name: Build and deploy mathematical notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Use the project's npm version
        run: npm install --global npm@10.9.2
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run check
      - run: npm test
      - run: npm run test:upstream
      - run: npm run build
      - run: npm run test:content
      - run: npm run test:knowledge
      - run: npm run check:ontology
      - run: npm run test:topic-map
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
